<!DOCTYPE html>
<html>
<head>
    <title>Fix Authentication Token</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px 20px; margin: 10px 0; }
        .token-display { background: #f5f5f5; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <h2>Fix Authentication Token - TJSMEDICAL</h2>
    
    <div id="status"></div>
    
    <button onclick="setValidToken()">Set Valid Token</button>
    <button onclick="testAuthentication()">Test Authentication</button>
    <button onclick="clearToken()">Clear Token</button>
    
    <div id="tokenInfo" class="token-display"></div>
    <div id="result"></div>
    
    <script>
    const API_BASE = '/PORTAL_ESTUDIOS/api';
    
    async function setValidToken() {
        try {
            const response = await fetch('/PORTAL_ESTUDIOS/get-token.php');
            const data = await response.json();
            
            if (data.success && data.token) {
                localStorage.setItem('sessionToken', data.token);
                document.getElementById('status').innerHTML = '<p class="success">✓ Token establecido correctamente</p>';
                document.getElementById('tokenInfo').innerHTML = `<strong>Token:</strong> ${data.token.substring(0, 20)}...`;
            } else {
                document.getElementById('status').innerHTML = '<p class="error">✗ Error obteniendo token</p>';
            }
        } catch (error) {
            document.getElementById('status').innerHTML = `<p class="error">✗ Error: ${error.message}</p>`;
        }
    }
    
    async function testAuthentication() {
        const token = localStorage.getItem('sessionToken');
        if (!token) {
            document.getElementById('result').innerHTML = '<p class="error">No hay token en localStorage</p>';
            return;
        }
        
        try {
            // Test 1: Validate session
            const validateResponse = await fetch(`${API_BASE}/auth/validate-session.php`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            const validateData = await validateResponse.json();
            let result = '<h3>Test Results:</h3>';
            
            if (validateData.success) {
                result += '<p class="success">✓ Session validation: SUCCESS</p>';
                result += `<p class="info">User: ${validateData.user.nombre} ${validateData.user.apellido}</p>`;
            } else {
                result += '<p class="error">✗ Session validation: FAILED</p>';
                result += `<p class="error">Message: ${validateData.message}</p>`;
            }
            
            // Test 2: Get reports API
            const reportsResponse = await fetch(`${API_BASE}/informes/get.php?informe_id=1`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            if (reportsResponse.ok) {
                result += '<p class="success">✓ Reports API: SUCCESS</p>';
            } else {
                result += `<p class="error">✗ Reports API: FAILED (${reportsResponse.status})</p>`;
            }
            
            document.getElementById('result').innerHTML = result;
            
        } catch (error) {
            document.getElementById('result').innerHTML = `<p class="error">✗ Test error: ${error.message}</p>`;
        }
    }
    
    function clearToken() {
        localStorage.removeItem('sessionToken');
        document.getElementById('status').innerHTML = '<p class="info">Token eliminado</p>';
        document.getElementById('tokenInfo').innerHTML = '';
        document.getElementById('result').innerHTML = '';
    }
    
    // Check current token on load
    window.onload = function() {
        const currentToken = localStorage.getItem('sessionToken');
        if (currentToken) {
            document.getElementById('tokenInfo').innerHTML = `<strong>Current Token:</strong> ${currentToken.substring(0, 20)}...`;
        } else {
            document.getElementById('tokenInfo').innerHTML = '<em>No token found in localStorage</em>';
        }
    }
    </script>
</body>
</html>
