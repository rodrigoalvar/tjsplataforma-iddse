<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Test Vista de Jerarquía</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .hierarchy-preview {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .parent-node {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border: 2px solid #2196f3;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .child-node {
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
            border: 2px solid #9c27b0;
            border-radius: 8px;
            padding: 12px;
            margin-left: 20px;
            position: relative;
        }
        .child-node::before {
            content: '';
            position: absolute;
            left: -15px;
            top: 50%;
            width: 10px;
            height: 2px;
            background: #9c27b0;
        }
        .dependents-preview {
            background: linear-gradient(135deg, #fff3e0 0%, #ffcc02 100%);
            border: 1px solid #ff9800;
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h1 class="card-title text-primary">
                    <i class="bi bi-bug"></i> Test Vista de Jerarquía
                </h1>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h5>Datos de Usuarios:</h5>
                        <div id="usersData" class="bg-light p-3 rounded" style="height: 300px; overflow-y: auto;">
                            <div class="text-center">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">Cargando...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h5>Log de Debug:</h5>
                        <div id="debugLog" class="bg-light p-3 rounded" style="height: 300px; overflow-y: auto;">
                            <small class="text-muted">Los logs aparecerán aquí...</small>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4">
                    <h5>Prueba de Vista de Jerarquía:</h5>
                    <div class="d-grid gap-2">
                        <button onclick="testHierarchyView()" class="btn btn-primary">
                            <i class="bi bi-test-tube"></i> Probar Vista de Jerarquía
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let allUsers = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
        });
        
        async function loadUsers() {
            try {
                logDebug('Cargando usuarios desde la API...');
                
                const response = await fetch('api/users/manage-real-complete.php');
                const result = await response.json();
                
                if (result.success) {
                    allUsers = result.data.users;
                    renderUsersData();
                    logDebug('✓ Usuarios cargados: ' + allUsers.length);
                } else {
                    logDebug('✗ Error cargando usuarios: ' + result.error);
                }
            } catch (error) {
                logDebug('✗ Error: ' + error.message);
            }
        }
        
        function renderUsersData() {
            const container = document.getElementById('usersData');
            container.innerHTML = allUsers.map(user => `
                <div class="mb-2 p-2 border rounded">
                    <strong>${user.nombre} ${user.apellido}</strong><br>
                    <small class="text-muted">ID: ${user.id} | Nivel: ${user.nivel}</small><br>
                    <small class="text-info">Padre: ${user.padre_nombre ? user.padre_nombre + ' ' + user.padre_apellido : 'Sin padre'}</small><br>
                    <button onclick="testUserHierarchy(${user.id})" class="btn btn-sm btn-outline-primary">
                        Probar Vista
                    </button>
                </div>
            `).join('');
        }
        
        function testHierarchyView() {
            const userWithParent = allUsers.find(u => u.padre_id);
            if (userWithParent) {
                testUserHierarchy(userWithParent.id);
            } else {
                logDebug('✗ No hay usuarios con padre para probar');
            }
        }
        
        function testUserHierarchy(userId) {
            const user = allUsers.find(u => u.id == userId);
            if (!user) {
                logDebug('✗ Usuario no encontrado');
                return;
            }
            
            logDebug('🧪 Probando vista de jerarquía para: ' + user.nombre + ' ' + user.apellido);
            logDebug('  - Usuario ID: ' + user.id);
            logDebug('  - Padre actual: ' + (user.padre_id || 'Sin padre'));
            
            // Simular la función updateHierarchyPreview
            updateHierarchyPreviewTest(user);
        }
        
        function updateHierarchyPreviewTest(user) {
            logDebug('📋 Actualizando vista de jerarquía...');
            
            // Simular el elemento preview
            const previewHtml = document.createElement('div');
            previewHtml.id = 'hierarchyPreview';
            previewHtml.className = 'hierarchy-preview';
            
            // Simular el select de padre
            const parentSelectHtml = document.createElement('select');
            parentSelectHtml.id = 'newParentId';
            parentSelectHtml.value = user.padre_id || '';
            
            // Simular la lógica de la función
            const newParentId = parentSelectHtml.value;
            logDebug('  - Nuevo padre seleccionado: ' + newParentId);
            
            if (!newParentId) {
                previewHtml.innerHTML = `
                    <div class="hierarchy-preview">
                        <div class="parent-node text-center">
                            <i class="bi bi-person-fill me-2"></i>
                            <strong>Usuario independiente</strong>
                            <br>
                            <small class="text-muted">Sin padre asignado</small>
                        </div>
                    </div>
                `;
                logDebug('✓ Vista actualizada: Usuario independiente');
            } else {
                const parent = allUsers.find(u => u.id == newParentId);
                const currentUser = user;
                
                logDebug('  - Padre encontrado: ' + (parent ? parent.nombre + ' ' + parent.apellido : 'No encontrado'));
                logDebug('  - Usuario actual: ' + currentUser.nombre + ' ' + currentUser.apellido);
                
                if (parent && currentUser) {
                    previewHtml.innerHTML = `
                        <div class="hierarchy-preview">
                            <div class="parent-node">
                                <div class="d-flex align-items-center mb-2">
                                    <i class="bi bi-person-fill me-2"></i>
                                    <strong>${parent.nombre} ${parent.apellido}</strong>
                                    <span class="badge bg-${parent.nivel === 'root' ? 'danger' : parent.nivel === 'admin' ? 'warning' : 'info'} ms-2">${parent.nivel.toUpperCase()}</span>
                                </div>
                                <small class="text-muted">${parent.email}</small>
                            </div>
                            
                            <div class="child-node ms-3 mt-2">
                                <div class="d-flex align-items-center">
                                    <i class="bi bi-arrow-right me-2"></i>
                                    <i class="bi bi-person me-2"></i>
                                    <strong>${currentUser.nombre} ${currentUser.apellido}</strong>
                                    <span class="badge bg-${currentUser.nivel === 'root' ? 'danger' : currentUser.nivel === 'admin' ? 'warning' : 'info'} ms-2">${currentUser.nivel.toUpperCase()}</span>
                                </div>
                                <small class="text-muted ms-5">${currentUser.email}</small>
                            </div>
                            
                            ${currentUser.dependientes_count > 0 ? `
                                <div class="dependents-preview ms-5 mt-2">
                                    <small class="text-info">
                                        <i class="bi bi-people me-1"></i>
                                        ${currentUser.dependientes_count} dependiente(s) también se moverán
                                    </small>
                                </div>
                            ` : ''}
                        </div>
                    `;
                    logDebug('✓ Vista actualizada: Jerarquía padre-hijo');
                } else {
                    previewHtml.innerHTML = `
                        <div class="hierarchy-preview">
                            <div class="alert alert-warning">
                                <i class="bi bi-exclamation-triangle me-2"></i>
                                Error al cargar la vista de jerarquía
                            </div>
                        </div>
                    `;
                    logDebug('✗ Error: No se encontraron padre o usuario actual');
                }
            }
            
            // Mostrar el resultado
            const container = document.querySelector('.card-body');
            const existingPreview = document.getElementById('testPreview');
            if (existingPreview) {
                existingPreview.remove();
            }
            
            const previewContainer = document.createElement('div');
            previewContainer.id = 'testPreview';
            previewContainer.className = 'mt-4';
            previewContainer.innerHTML = `
                <h5>Resultado de la Vista de Jerarquía:</h5>
                <div class="card">
                    <div class="card-body">
                        ${previewHtml.innerHTML}
                    </div>
                </div>
            `;
            
            container.appendChild(previewContainer);
            logDebug('✅ Vista de jerarquía mostrada');
        }
        
        function logDebug(message) {
            const log = document.getElementById('debugLog');
            const timestamp = new Date().toLocaleTimeString();
            log.innerHTML += `<div><small class="text-muted">[${timestamp}]</small> ${message}</div>`;
            log.scrollTop = log.scrollHeight;
        }
    </script>
</body>
</html>
