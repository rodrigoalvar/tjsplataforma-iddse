<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Frontend Data</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .study { border: 1px solid #ccc; margin: 10px 0; padding: 15px; border-radius: 5px; }
        .study h3 { margin-top: 0; color: #333; }
        .antecedents { background: #f9f9f9; padding: 10px; margin: 10px 0; border-radius: 3px; }
        .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 3px; }
        .success { color: green; background: #e6ffe6; padding: 10px; border-radius: 3px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Debug Frontend Data - Usuario TUCUMAN INFORMANTES</h1>
    <div id="results"></div>

    <script>
        async function debugFrontendData() {
            const resultsDiv = document.getElementById('results');
            
            try {
                resultsDiv.innerHTML = '<p>Cargando datos de la API...</p>';
                
                // Simular cookie de sesión para usuario TUCUMAN
                document.cookie = 'session_token=test_token_tucuman; path=/';
                
                const response = await fetch('api/get_user_assigned_studies_fixed.php');
                const data = await response.json();
                
                console.log('Respuesta completa de la API:', data);
                
                let html = '';
                
                if (data.success && data.data && data.data.studies) {
                    html += `<div class="success">✅ API respondió correctamente con ${data.data.studies.length} estudios</div>`;
                    
                    data.data.studies.forEach((study, index) => {
                        html += `
                            <div class="study">
                                <h3>Estudio ${index + 1}: ${study.study_id}</h3>
                                <p><strong>Paciente:</strong> ${study.patient_name}</p>
                                <p><strong>Fecha:</strong> ${study.study_date}</p>
                                
                                <div class="antecedents">
                                    <h4>Datos de Antecedentes:</h4>
                                    <pre>${JSON.stringify(study.antecedents, null, 2)}</pre>
                                    
                                    <h4>Análisis:</h4>
                                    <ul>
                                        <li><strong>has_notes:</strong> ${study.antecedents.has_notes ? '✅ SÍ' : '❌ NO'}</li>
                                        <li><strong>has_files:</strong> ${study.antecedents.has_files ? '✅ SÍ' : '❌ NO'}</li>
                                        <li><strong>has_images:</strong> ${study.antecedents.has_images ? '✅ SÍ' : '❌ NO'}</li>
                                        <li><strong>has_camera_captures:</strong> ${study.antecedents.has_camera_captures ? '✅ SÍ' : '❌ NO'}</li>
                                        <li><strong>total_count:</strong> ${study.antecedents.total_count}</li>
                                    </ul>
                                    
                                    <h4>¿Debería mostrar badge?</h4>
                                    ${(study.antecedents.has_notes || study.antecedents.has_files || study.antecedents.has_images || study.antecedents.has_camera_captures || study.antecedents.total_count > 0) ? 
                                        '<p style="color: green;">✅ SÍ - Debería mostrar badge con contador ' + study.antecedents.total_count + '</p>' : 
                                        '<p style="color: red;">❌ NO - No debería mostrar badge</p>'
                                    }
                                </div>
                            </div>
                        `;
                    });
                } else {
                    html += `<div class="error">❌ Error en la API: ${data.error || 'Respuesta no válida'}</div>`;
                    html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                console.error('Error:', error);
                resultsDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        // Ejecutar al cargar la página
        debugFrontendData();
    </script>
</body>
</html>
