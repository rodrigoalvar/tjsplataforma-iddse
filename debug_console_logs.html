<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Console Logs</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { margin: 5px 0; padding: 5px; border-left: 3px solid #ccc; }
        .log.info { border-color: #007bff; background: #e7f3ff; }
        .log.warn { border-color: #ffc107; background: #fff3cd; }
        .log.error { border-color: #dc3545; background: #f8d7da; }
        .log.debug { border-color: #6f42c1; background: #f3e5f5; }
        pre { margin: 0; }
        #logs { max-height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; }
        .study-row { border: 1px solid #ddd; margin: 10px 0; padding: 10px; }
    </style>
</head>
<body>
    <h1>Debug Console Logs - Dashboard Behavior</h1>
    
    <div>
        <button onclick="simulateDashboard()">Simular Dashboard</button>
        <button onclick="clearLogs()">Limpiar Logs</button>
    </div>
    
    <div id="logs"></div>
    <div id="studies"></div>

    <script>
        const logsDiv = document.getElementById('logs');
        const studiesDiv = document.getElementById('studies');
        
        // Interceptar console.log
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        
        function addLog(message, type = 'info') {
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = `<pre>${new Date().toLocaleTimeString()} [${type.toUpperCase()}] ${message}</pre>`;
            logsDiv.appendChild(logDiv);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addLog(args.join(' '), 'info');
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addLog(args.join(' '), 'warn');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addLog(args.join(' '), 'error');
        };
        
        function clearLogs() {
            logsDiv.innerHTML = '';
            studiesDiv.innerHTML = '';
        }
        
        async function simulateDashboard() {
            clearLogs();
            console.log('🚀 Iniciando simulación del dashboard...');
            
            try {
                // Simular cookie de sesión
                document.cookie = 'session_token=test_token_tucuman; path=/';
                console.log('🍪 Cookie de sesión establecida');
                
                // Llamar a la API
                console.log('📡 Llamando a la API...');
                const response = await fetch('api/get_user_assigned_studies_fixed.php');
                const result = await response.json();
                
                console.log('📋 Respuesta de la API recibida:', JSON.stringify(result, null, 2));
                
                if (result.success && result.data && result.data.studies) {
                    const studies = result.data.studies;
                    console.log(`✅ ${studies.length} estudios cargados`);
                    
                    // Simular el procesamiento de cada estudio
                    studies.forEach((study, index) => {
                        console.log(`🔍 Procesando estudio ${index + 1}: ${study.study_id}`);
                        console.log(`  - Antecedents data:`, study.antecedents);
                        
                        const antecedentsCount = study.antecedents ? study.antecedents.total_count : 0;
                        const hasAntecedents = study.antecedents && (
                            study.antecedents.has_notes || 
                            study.antecedents.has_files || 
                            study.antecedents.has_images || 
                            study.antecedents.has_camera_captures ||
                            antecedentsCount > 0
                        );
                        
                        console.log(`🔍 Debug createStudyRow - Estudio ${study.study_id}: antecedentsCount = ${antecedentsCount}, hasAntecedents = ${hasAntecedents}`);
                        
                        // Crear representación visual
                        const studyDiv = document.createElement('div');
                        studyDiv.className = 'study-row';
                        studyDiv.innerHTML = `
                            <h4>Estudio: ${study.study_id}</h4>
                            <p><strong>Paciente:</strong> ${study.patient_name}</p>
                            <p><strong>Antecedents Count:</strong> ${antecedentsCount}</p>
                            <p><strong>Has Antecedents:</strong> ${hasAntecedents ? '✅ SÍ' : '❌ NO'}</p>
                            <p><strong>Badge mostrado:</strong> ${hasAntecedents ? 
                                `<span style="background: #ffc107; padding: 5px 10px; border-radius: 5px;">📄 ${antecedentsCount}</span>` : 
                                '<span style="color: #6c757d;">-</span>'
                            }</p>
                            <details>
                                <summary>Datos completos de antecedentes</summary>
                                <pre>${JSON.stringify(study.antecedents, null, 2)}</pre>
                            </details>
                        `;
                        studiesDiv.appendChild(studyDiv);
                    });
                    
                } else {
                    console.error('❌ Error en la respuesta de la API:', result.error || 'Respuesta no válida');
                }
                
            } catch (error) {
                console.error('💥 Error en la simulación:', error.message);
            }
        }
    </script>
</body>
</html>
