<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Editor - Guardar Informe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
</head>
<body>
    <div class="container mt-5">
        <h2>Debug: Botón Guardar Informe</h2>
        
        <!-- Elemento para mostrar mensajes -->
        <div id="statusMessage" class="alert alert-info mt-3" style="display: none;"></div>
        
        <!-- Simulación del editor -->
        <div class="mb-3">
            <label for="reportEditor" class="form-label">Editor de Informe:</label>
            <textarea id="reportEditor" class="form-control" rows="10">Contenido de prueba del informe médico...</textarea>
        </div>
        
        <!-- Botón de guardar -->
        <button id="btnSaveReport" class="btn btn-success btn-lg" onclick="testSaveReport()">
            <i class="fas fa-save me-2"></i>
            Guardar Informe
        </button>
        
        <!-- Información de debug -->
        <div class="mt-4">
            <h4>Información de Debug:</h4>
            <div id="debugInfo" class="bg-light p-3 rounded">
                <p><strong>URL actual:</strong> <span id="currentUrl"></span></p>
                <p><strong>Parámetros URL:</strong> <span id="urlParams"></span></p>
                <p><strong>Token de sesión:</strong> <span id="sessionToken"></span></p>
            </div>
        </div>
        
        <!-- Log de consola -->
        <div class="mt-4">
            <h4>Log de Consola:</h4>
            <div id="consoleLog" class="bg-dark text-light p-3 rounded" style="height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px;"></div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/reports.js"></script>
    
    <script>
        // Interceptar console.log para mostrar en la página
        const originalLog = console.log;
        const originalError = console.error;
        const consoleLogDiv = document.getElementById('consoleLog');
        
        function addToConsoleLog(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<span style="color: #888;">[${timestamp}]</span> <span style="color: ${type === 'error' ? '#ff6b6b' : '#4ecdc4'};">[${type.toUpperCase()}]</span> ${message}`;
            consoleLogDiv.appendChild(logEntry);
            consoleLogDiv.scrollTop = consoleLogDiv.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsoleLog(args.join(' '), 'log');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addToConsoleLog(args.join(' '), 'error');
        };
        
        // Inicializar TinyMCE
        tinymce.init({
            selector: '#reportEditor',
            height: 300,
            menubar: false,
            toolbar: 'undo redo | bold italic | alignleft aligncenter alignright | bullist numlist',
            setup: function(editor) {
                editor.on('init', function() {
                    console.log('TinyMCE inicializado correctamente');
                });
            }
        });
        
        // Función de prueba del botón guardar
        async function testSaveReport() {
            console.log('=== INICIO TEST SAVE REPORT ===');
            
            if (typeof ReportsModule !== 'undefined' && ReportsModule.saveReport) {
                console.log('ReportsModule encontrado, llamando a saveReport...');
                await ReportsModule.saveReport();
            } else {
                console.error('ReportsModule no está disponible');
                showMessage('Error: ReportsModule no está cargado', 'error');
            }
        }
        
        // Función showMessage local (fallback)
        function showMessage(message, type = 'info') {
            console.log('Mostrando mensaje:', message, 'Tipo:', type);
            
            const statusDiv = document.getElementById('statusMessage');
            if (statusDiv) {
                statusDiv.className = `alert alert-${type === 'error' ? 'danger' : type === 'success' ? 'success' : 'info'} mt-3`;
                statusDiv.textContent = message;
                statusDiv.style.display = 'block';
                
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 5000);
            }
        }
        
        // Simular cookie de sesión para pruebas
        function setCookie(name, value, days) {
            const expires = new Date();
            expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = name + '=' + value + ';expires=' + expires.toUTCString() + ';path=/';
        }
        
        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Página de debug cargada');
            
            // Mostrar información de debug
            document.getElementById('currentUrl').textContent = window.location.href;
            
            const urlParams = new URLSearchParams(window.location.search);
            const params = {};
            for (const [key, value] of urlParams) {
                params[key] = value;
            }
            document.getElementById('urlParams').textContent = JSON.stringify(params, null, 2);
            
            // Usar token de sesión válido
            const validToken = 'test_session_801dc80898606a858fdcc554124e7f21';
            console.log('Configurando token de sesión válido...');
            setCookie('session_token', validToken, 1);
            localStorage.setItem('sessionToken', validToken);
            
            document.getElementById('sessionToken').textContent = validToken;
            
            // Verificar si ReportsModule está disponible
            setTimeout(() => {
                if (typeof ReportsModule !== 'undefined') {
                    console.log('ReportsModule cargado correctamente');
                    console.log('Métodos disponibles:', Object.keys(ReportsModule));
                } else {
                    console.error('ReportsModule NO está disponible');
                }
            }, 1000);
        });
        
        // Función auxiliar para obtener cookies
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }
    </script>
</body>
</html>
