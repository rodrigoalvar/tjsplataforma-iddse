<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Test Botón Nuevo Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h1 class="card-title text-primary">
                    <i class="bi bi-bug"></i> Test Botón Nuevo Usuario
                </h1>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h5>Verificaciones:</h5>
                        <div id="verifications" class="bg-light p-3 rounded" style="height: 300px; overflow-y: auto;">
                            <div class="text-center">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">Verificando...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h5>Log de Pruebas:</h5>
                        <div id="testLog" class="bg-light p-3 rounded" style="height: 300px; overflow-y: auto;">
                            <small class="text-muted">Los logs aparecerán aquí...</small>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4">
                    <h5>Pruebas del Botón:</h5>
                    <div class="d-grid gap-2">
                        <button onclick="testNewUserButton()" class="btn btn-primary">
                            <i class="bi bi-test-tube"></i> Probar Botón Nuevo Usuario
                        </button>
                        <button onclick="testModalElements()" class="btn btn-info">
                            <i class="bi bi-search"></i> Verificar Elementos del Modal
                        </button>
                        <button onclick="testFormValidation()" class="btn btn-warning">
                            <i class="bi bi-check-circle"></i> Probar Validación del Formulario
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            runVerifications();
        });
        
        function runVerifications() {
            const container = document.getElementById('verifications');
            const checks = [
                { name: 'Botón Nuevo Usuario existe', check: () => document.querySelector('button[onclick="showCreateUserModal()"]') },
                { name: 'Función showCreateUserModal existe', check: () => typeof showCreateUserModal === 'function' },
                { name: 'Modal userModal existe', check: () => document.getElementById('userModal') },
                { name: 'Formulario userForm existe', check: () => document.getElementById('userForm') },
                { name: 'Función saveUser existe', check: () => typeof saveUser === 'function' },
                { name: 'Botón Guardar existe', check: () => document.querySelector('button[onclick="saveUser()"]') },
                { name: 'Campo nombre existe', check: () => document.getElementById('nombre') },
                { name: 'Campo apellido existe', check: () => document.getElementById('apellido') },
                { name: 'Campo email existe', check: () => document.getElementById('email') },
                { name: 'Campo nivel existe', check: () => document.getElementById('nivel') },
                { name: 'Campo padre_id existe', check: () => document.getElementById('padre_id') },
                { name: 'Campo password existe', check: () => document.getElementById('password') }
            ];
            
            container.innerHTML = checks.map(check => {
                const result = check.check();
                const status = result ? 'success' : 'danger';
                const icon = result ? 'check-circle' : 'x-circle';
                return `
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span>${check.name}</span>
                        <i class="bi bi-${icon} text-${status}"></i>
                    </div>
                `;
            }).join('');
        }
        
        function testNewUserButton() {
            logTest('🧪 Probando botón Nuevo Usuario...');
            
            try {
                // Verificar que la función existe
                if (typeof showCreateUserModal === 'function') {
                    logTest('✓ Función showCreateUserModal encontrada');
                    
                    // Simular clic en el botón
                    logTest('📱 Simulando clic en el botón...');
                    
                    // Verificar elementos del modal
                    const modal = document.getElementById('userModal');
                    if (modal) {
                        logTest('✓ Modal userModal encontrado');
                        
                        // Verificar título
                        const title = document.getElementById('userModalTitle');
                        if (title) {
                            logTest('✓ Título del modal encontrado');
                        }
                        
                        // Verificar formulario
                        const form = document.getElementById('userForm');
                        if (form) {
                            logTest('✓ Formulario userForm encontrado');
                        }
                        
                        logTest('✅ Botón Nuevo Usuario está configurado correctamente');
                    } else {
                        logTest('✗ Modal userModal no encontrado');
                    }
                } else {
                    logTest('✗ Función showCreateUserModal no encontrada');
                }
            } catch (error) {
                logTest('✗ Error: ' + error.message);
            }
        }
        
        function testModalElements() {
            logTest('🔍 Verificando elementos del modal...');
            
            const elements = [
                { id: 'userModalTitle', name: 'Título del modal' },
                { id: 'userId', name: 'Campo ID oculto' },
                { id: 'nombre', name: 'Campo nombre' },
                { id: 'apellido', name: 'Campo apellido' },
                { id: 'email', name: 'Campo email' },
                { id: 'telefono', name: 'Campo teléfono' },
                { id: 'matricula_profesional', name: 'Campo matrícula' },
                { id: 'especialidad', name: 'Campo especialidad' },
                { id: 'nivel', name: 'Campo nivel' },
                { id: 'padre_id', name: 'Campo padre' },
                { id: 'password', name: 'Campo contraseña' },
                { id: 'permissionsContainer', name: 'Contenedor de permisos' }
            ];
            
            elements.forEach(element => {
                const el = document.getElementById(element.id);
                if (el) {
                    logTest(`✓ ${element.name} encontrado`);
                } else {
                    logTest(`✗ ${element.name} no encontrado`);
                }
            });
        }
        
        function testFormValidation() {
            logTest('📋 Probando validación del formulario...');
            
            const form = document.getElementById('userForm');
            if (!form) {
                logTest('✗ Formulario no encontrado');
                return;
            }
            
            // Verificar campos requeridos
            const requiredFields = ['nombre', 'apellido', 'email', 'nivel'];
            requiredFields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                if (field) {
                    logTest(`✓ Campo requerido ${fieldId} encontrado`);
                } else {
                    logTest(`✗ Campo requerido ${fieldId} no encontrado`);
                }
            });
            
            // Verificar botón de guardar
            const saveButton = document.querySelector('button[onclick="saveUser()"]');
            if (saveButton) {
                logTest('✓ Botón Guardar encontrado');
            } else {
                logTest('✗ Botón Guardar no encontrado');
            }
            
            logTest('✅ Validación del formulario completada');
        }
        
        function logTest(message) {
            const log = document.getElementById('testLog');
            const timestamp = new Date().toLocaleTimeString();
            log.innerHTML += `<div><small class="text-muted">[${timestamp}]</small> ${message}</div>`;
            log.scrollTop = log.scrollHeight;
        }
    </script>
</body>
</html>
