<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Botones de Eliminar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2>Diagnóstico - Botones de Eliminar</h2>
        
        <div class="card">
            <div class="card-body">
                <h5>Estado de los Event Listeners</h5>
                <div id="diagnosticResults"></div>
                
                <button class="btn btn-primary mt-3" onclick="runDiagnostic()">
                    Ejecutar Diagnóstico
                </button>
                
                <button class="btn btn-success mt-3" onclick="testDeleteFunction()">
                    Probar Función deleteFile
                </button>
                
                <button class="btn btn-warning mt-3" onclick="testMultipleDeleteFunction()">
                    Probar Función deleteMultipleFiles
                </button>
            </div>
        </div>
        
        <!-- Simular estructura de archivos -->
        <div class="card mt-4">
            <div class="card-body">
                <h5>Simulación de Archivos</h5>
                <div id="uploadedFiles">
                    <!-- Se llenará con archivos simulados -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación Bootstrap -->
    <div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true" style="z-index: 1080 !important;">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmationModalLabel">
                        <i class="fas fa-exclamation-triangle text-warning me-2"></i>Confirmar Eliminación
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="singleFileMessage" style="display: none;">
                        <p class="mb-3">¿Está seguro de que desea eliminar el archivo:</p>
                        <div class="alert alert-warning">
                            <i class="fas fa-file me-2"></i>
                            <strong id="fileNameToDelete"></strong>
                        </div>
                        <p class="text-muted small mb-0">
                            <i class="fas fa-info-circle me-1"></i>
                            Esta acción no se puede deshacer.
                        </p>
                    </div>
                    
                    <div id="multipleFilesMessage" style="display: none;">
                        <p class="mb-3">¿Está seguro de que desea eliminar los siguientes archivos?</p>
                        <div class="border rounded p-2 bg-light" style="max-height: 200px; overflow-y: auto;">
                            <ul id="filesListContent" class="list-unstyled mb-0">
                                <!-- Se llenará dinámicamente -->
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i>Cancelar
                    </button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                        <i class="fas fa-trash me-1"></i>Eliminar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/FileViewer.js"></script>
    <script src="assets/js/estudios-manager.js"></script>
    
    <script>
        function runDiagnostic() {
            const results = document.getElementById('diagnosticResults');
            let html = '<div class="mt-3">';
            
            // Verificar si DerivacionesManager existe
            html += '<h6>1. Verificación de DerivacionesManager:</h6>';
            if (typeof derivacionesManager !== 'undefined') {
                html += '<div class="alert alert-success">✓ derivacionesManager está definido</div>';
                
                // Verificar métodos
                if (typeof derivacionesManager.deleteFile === 'function') {
                    html += '<div class="alert alert-success">✓ Método deleteFile existe</div>';
                } else {
                    html += '<div class="alert alert-danger">✗ Método deleteFile NO existe</div>';
                }
                
                if (typeof derivacionesManager.deleteMultipleFiles === 'function') {
                    html += '<div class="alert alert-success">✓ Método deleteMultipleFiles existe</div>';
                } else {
                    html += '<div class="alert alert-danger">✗ Método deleteMultipleFiles NO existe</div>';
                }
                
                if (typeof derivacionesManager.showConfirmationModal === 'function') {
                    html += '<div class="alert alert-success">✓ Método showConfirmationModal existe</div>';
                } else {
                    html += '<div class="alert alert-danger">✗ Método showConfirmationModal NO existe</div>';
                }
                
            } else {
                html += '<div class="alert alert-danger">✗ derivacionesManager NO está definido</div>';
            }
            
            // Verificar elementos del DOM
            html += '<h6>2. Verificación de elementos DOM:</h6>';
            
            const confirmationModal = document.getElementById('confirmationModal');
            if (confirmationModal) {
                html += '<div class="alert alert-success">✓ Modal de confirmación existe</div>';
            } else {
                html += '<div class="alert alert-danger">✗ Modal de confirmación NO existe</div>';
            }
            
            const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
            if (confirmDeleteBtn) {
                html += '<div class="alert alert-success">✓ Botón de confirmar eliminación existe</div>';
            } else {
                html += '<div class="alert alert-danger">✗ Botón de confirmar eliminación NO existe</div>';
            }
            
            // Verificar Bootstrap
            html += '<h6>3. Verificación de Bootstrap:</h6>';
            if (typeof bootstrap !== 'undefined') {
                html += '<div class="alert alert-success">✓ Bootstrap está cargado</div>';
            } else {
                html += '<div class="alert alert-danger">✗ Bootstrap NO está cargado</div>';
            }
            
            html += '</div>';
            results.innerHTML = html;
        }
        
        function testDeleteFunction() {
            console.log('Probando función deleteFile...');
            if (typeof derivacionesManager !== 'undefined' && typeof derivacionesManager.deleteFile === 'function') {
                try {
                    derivacionesManager.deleteFile(999, 'test-file.pdf');
                    console.log('✓ Función deleteFile ejecutada sin errores');
                } catch (error) {
                    console.error('✗ Error en deleteFile:', error);
                }
            } else {
                console.error('✗ derivacionesManager.deleteFile no está disponible');
            }
        }
        
        function testMultipleDeleteFunction() {
            console.log('Probando función deleteMultipleFiles...');
            if (typeof derivacionesManager !== 'undefined' && typeof derivacionesManager.deleteMultipleFiles === 'function') {
                try {
                    derivacionesManager.deleteMultipleFiles([999, 1000]);
                    console.log('✓ Función deleteMultipleFiles ejecutada sin errores');
                } catch (error) {
                    console.error('✗ Error en deleteMultipleFiles:', error);
                }
            } else {
                console.error('✗ derivacionesManager.deleteMultipleFiles no está disponible');
            }
        }
        
        // Simular algunos archivos para pruebas
        document.addEventListener('DOMContentLoaded', function() {
            const uploadedFiles = document.getElementById('uploadedFiles');
            uploadedFiles.innerHTML = `
                <div class="mb-3 d-flex justify-content-between align-items-center">
                    <div>
                        <input type="checkbox" id="selectAllFiles" class="form-check-input me-2">
                        <label for="selectAllFiles" class="form-check-label">Seleccionar todos</label>
                    </div>
                    <button type="button" class="btn btn-danger btn-sm" id="deleteSelectedFiles" disabled>
                        <i class="fas fa-trash me-1"></i>Eliminar seleccionados
                    </button>
                </div>
                <div class="row g-3" id="file-viewer-container">
                    <div class="col-md-4">
                        <div class="card" data-file-id="999" data-file-path="test1.pdf">
                            <div class="card-body">
                                <strong class="file-name">test1.pdf</strong>
                                <div class="file-actions">
                                    <button class="btn btn-outline-danger btn-sm mt-1" onclick="derivacionesManager.deleteFile(999, 'test1.pdf')">
                                        <i class="fas fa-trash me-1"></i>Eliminar
                                    </button>
                                </div>
                            </div>
                            <div class="form-check position-absolute" style="top: 10px; right: 10px; z-index: 10;">
                                <input class="form-check-input file-checkbox" type="checkbox" value="999" id="file-999" data-file-id="999">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card" data-file-id="1000" data-file-path="test2.pdf">
                            <div class="card-body">
                                <strong class="file-name">test2.pdf</strong>
                                <div class="file-actions">
                                    <button class="btn btn-outline-danger btn-sm mt-1" onclick="derivacionesManager.deleteFile(1000, 'test2.pdf')">
                                        <i class="fas fa-trash me-1"></i>Eliminar
                                    </button>
                                </div>
                            </div>
                            <div class="form-check position-absolute" style="top: 10px; right: 10px; z-index: 10;">
                                <input class="form-check-input file-checkbox" type="checkbox" value="1000" id="file-1000" data-file-id="1000">
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Configurar eventos de selección múltiple si derivacionesManager está disponible
            setTimeout(() => {
                if (typeof derivacionesManager !== 'undefined' && typeof derivacionesManager.setupMultipleSelectionEvents === 'function') {
                    derivacionesManager.setupMultipleSelectionEvents();
                    console.log('Eventos de selección múltiple configurados');
                }
            }, 1000);
        });
    </script>
</body>
</html>
