<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Save Button</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Test del Botón Guardar Informe</h2>
        
        <!-- Elemento para mostrar mensajes -->
        <div id="statusMessage" class="alert alert-info mt-3" style="display: none;"></div>
        
        <!-- Botón de prueba -->
        <button class="btn btn-success btn-lg" onclick="testSaveReport()">
            <i class="fas fa-save me-2"></i>
            Guardar Informe (Test)
        </button>
        
        <!-- Área de texto simulando TinyMCE -->
        <textarea id="reportEditor" class="form-control mt-3" rows="10" placeholder="Contenido del informe..."></textarea>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
    
    <script>
        // Simular TinyMCE
        const tinymce = {
            get: function(id) {
                return {
                    getContent: function() {
                        return document.getElementById(id).value || 'Contenido de prueba';
                    }
                };
            }
        };
        
        // Función de prueba
        async function testSaveReport() {
            console.log('Iniciando test de saveReport...');
            
            try {
                // Simular la función showMessage
                showMessage('Iniciando prueba de guardado...', 'info');
                
                // Simular delay
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Simular éxito
                showMessage('¡Prueba exitosa! El botón funciona correctamente.', 'success');
                
            } catch (error) {
                console.error('Error en test:', error);
                showMessage('Error en la prueba: ' + error.message, 'error');
            }
        }
        
        // Función showMessage
        function showMessage(message, type = 'info') {
            console.log('Mostrando mensaje:', message, 'Tipo:', type);
            
            const statusDiv = document.getElementById('statusMessage');
            if (statusDiv) {
                statusDiv.className = `alert alert-${type === 'error' ? 'danger' : type === 'success' ? 'success' : 'info'} mt-3`;
                statusDiv.textContent = message;
                statusDiv.style.display = 'block';
                
                // Auto-ocultar después de 5 segundos
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 5000);
            } else {
                console.error('No se encontró el elemento statusMessage');
                alert(message); // Fallback
            }
        }
        
        // Test inicial
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Página de test cargada');
            showMessage('Página de test lista. Haz clic en el botón para probar.', 'info');
        });
    </script>
</body>
</html>
