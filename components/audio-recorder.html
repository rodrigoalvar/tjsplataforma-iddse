<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grabador de Audio - TJS Medical</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/reports.css">
    <script src="../js/auth-middleware.js"></script>
    <script src="../assets/js/iframe-detector.js"></script>
    <style>
        .standalone-recorder {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .standalone-recorder {
                margin: 20px 10px;
                padding: 15px;
            }
        }

        .recordings-list {
            margin-top: 20px;
        }

        .recording-item {
            background-color: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media (max-width: 576px) {
            .recording-item {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            
            .recording-actions {
                justify-content: center;
            }
        }

        .recording-info {
            flex: 1;
        }

        .recording-actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="standalone-recorder">
            <h3 class="mb-4">Grabador de Audio</h3>

            <!-- Controles de grabación -->
            <div class="audio-recorder card">
                <div class="card-body">
                    <div class="audio-controls d-flex flex-wrap align-items-center gap-2">
                        <button id="recordButton" class="control-button record-button btn-lg" onclick="AudioModule.startRecording()">
                            Iniciar Grabación
                        </button>
                        <button id="stopButton" class="control-button btn-lg" onclick="AudioModule.stopRecording()" disabled>
                            Detener
                        </button>
                        <span id="timer" class="recording-timer ms-auto">00:00</span>
                    </div>

                    <div id="audioContainer" style="display: none;" class="audio-player-container mt-3">
                        <audio id="audioPlayer" controls></audio>
                    </div>
                </div>
            </div>

            <!-- Lista de grabaciones -->
            <div class="recordings-list">
                <h5>Grabaciones Guardadas</h5>
                <div id="recordingsList">
                    <!-- Las grabaciones se agregarán aquí dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/audio.js"></script>

    <script>
        // Extensión del módulo de audio para manejar la lista de grabaciones
        const RecordingsManager = {
            recordings: [],

            // Agregar una nueva grabación
            addRecording: function(audioUrl, timestamp) {
                const recording = {
                    id: Date.now(),
                    url: audioUrl,
                    timestamp: timestamp || new Date().toLocaleString()
                };

                this.recordings.push(recording);
                this.updateRecordingsList();
            },

            // Eliminar una grabación
            deleteRecording: function(id) {
                this.recordings = this.recordings.filter(rec => rec.id !== id);
                this.updateRecordingsList();
            },

            // Actualizar la lista de grabaciones en la UI
            updateRecordingsList: function() {
                const container = document.getElementById('recordingsList');
                container.innerHTML = '';

                this.recordings.forEach(recording => {
                    const item = document.createElement('div');
                    item.className = 'recording-item';
                    item.innerHTML = `
                        <div class="recording-info">
                            <div>Grabación del ${recording.timestamp}</div>
                        </div>
                        <div class="recording-actions">
                            <audio src="${recording.url}" controls></audio>
                            <button class="btn btn-danger btn-sm" onclick="RecordingsManager.deleteRecording(${recording.id})">
                                Eliminar
                            </button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }
        };

        // Extender el AudioModule para integrar con RecordingsManager
        const originalDisplayRecording = AudioModule.displayRecording;
        AudioModule.displayRecording = function(audioUrl) {
            originalDisplayRecording.call(this, audioUrl);
            RecordingsManager.addRecording(audioUrl);
        };

        // Inicializar el grabador
        document.addEventListener('DOMContentLoaded', async function() {
            const isAuthenticated = await requireAuth();
            if (!isAuthenticated) {
                return; // La función requireAuth ya maneja la redirección
            }
            AudioModule.initRecorder();
        });
    </script>
</body>
</html>
