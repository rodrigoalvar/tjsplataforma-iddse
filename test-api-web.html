<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba API Informes</title>
</head>
<body>
    <h1>Prueba API Informes</h1>
    <button onclick="testSimpleAPI()">Probar API Simple</button>
    <button onclick="testRobustAPI()">Probar API Robusto</button>
    <div id="result"></div>

    <script>
        async function testSimpleAPI() {
            try {
                const response = await fetch('../api/informes/test-simple.php');
                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }

        async function testRobustAPI() {
            try {
                const response = await fetch('../api/informes/get-simple-robust.php?informe_id=35');
                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
