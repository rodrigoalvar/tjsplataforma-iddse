<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏗️ Gestión de Jerarquías - Portal Estudios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/permissions-badges.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h1 class="card-title text-primary">
                    <i class="fas fa-sitemap"></i> Gestión de Jerarquías
                </h1>
                <p class="text-muted">Administra las cuentas principales y dependientes</p>
            </div>
            <div class="card-body">
                <!-- Filtros -->
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-search"></i></span>
                            <input type="text" class="form-control" id="searchInput" placeholder="Buscar usuarios...">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <select class="form-select" id="levelFilter">
                            <option value="">Todos los niveles</option>
                            <option value="root">ROOT</option>
                            <option value="admin">ADMIN</option>
                            <option value="user">USER</option>
                        </select>
                    </div>
                </div>
                
                <!-- Botones de acción -->
                <div class="row mb-4">
                    <div class="col-md-12">
                        <button onclick="loadHierarchy()" class="btn btn-primary">
                            <i class="fas fa-sync"></i> Actualizar
                        </button>
                        <button onclick="showAssignModal()" class="btn btn-success">
                            <i class="fas fa-link"></i> Asignar Jerarquía
                        </button>
                    </div>
                </div>
                
                <!-- Tabla de usuarios -->
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Nivel</th>
                                <th>Padre</th>
                                <th>Dependientes</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="7" class="text-center">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Cargando...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Vista de jerarquía -->
                <div class="mt-4">
                    <h5><i class="fas fa-sitemap"></i> Vista de Jerarquía</h5>
                    <div id="hierarchyView" class="border p-3 rounded bg-light">
                        <div class="text-center text-muted">
                            <i class="fas fa-sitemap fa-2x mb-2"></i>
                            <p>Jerarquía se mostrará aquí</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal para asignar jerarquía -->
    <div class="modal fade" id="assignModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Asignar Jerarquía</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="assignForm">
                        <div class="mb-3">
                            <label class="form-label">Usuario:</label>
                            <select class="form-select" id="assignUserId" required>
                                <option value="">Seleccionar usuario...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nivel:</label>
                            <select class="form-select" id="assignLevel" required>
                                <option value="">Seleccionar nivel...</option>
                                <option value="root">ROOT</option>
                                <option value="admin">ADMIN</option>
                                <option value="user">USER</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cuenta Principal (Padre):</label>
                            <select class="form-select" id="assignParentId">
                                <option value="">Sin cuenta principal</option>
                            </select>
                            <small class="form-text text-muted">Cualquier usuario puede ser padre de otro usuario</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="saveAssignment()">Guardar</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allUsers = [];
        let hierarchy = [];
        
        // Cargar jerarquía al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            loadHierarchy();
            
            // Agregar evento para actualizar padres cuando cambie el usuario
            document.getElementById('assignUserId').addEventListener('change', function() {
                loadPossibleParents();
            });
        });
        
        async function loadHierarchy() {
            try {
                const response = await fetch('api/users/hierarchy.php');
                const result = await response.json();
                
                if (result.success) {
                    allUsers = result.data.users;
                    hierarchy = result.data.hierarchy;
                    
                    renderUsersTable();
                    renderHierarchyView();
                    loadPossibleParents();
                } else {
                    showAlert('Error cargando jerarquía: ' + result.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error cargando jerarquía: ' + error.message, 'error');
            }
        }
        
        function renderUsersTable() {
            const tbody = document.getElementById('usersTableBody');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const levelFilter = document.getElementById('levelFilter').value;
            
            let filteredUsers = allUsers.filter(user => {
                const matchesSearch = !searchTerm || 
                    user.nombre.toLowerCase().includes(searchTerm) ||
                    user.apellido.toLowerCase().includes(searchTerm) ||
                    user.email.toLowerCase().includes(searchTerm);
                    
                const matchesLevel = !levelFilter || user.nivel === levelFilter;
                
                return matchesSearch && matchesLevel;
            });
            
            tbody.innerHTML = filteredUsers.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.nombre} ${user.apellido}</td>
                    <td>${user.email}</td>
                    <td>
                        <span class="badge bg-${user.nivel === 'root' ? 'danger' : user.nivel === 'admin' ? 'warning' : 'info'}">
                            ${user.nivel.toUpperCase()}
                        </span>
                    </td>
                    <td>
                        ${user.padre_nombre ? 
                            `${user.padre_nombre} ${user.padre_apellido}` : 
                            '<small class="text-muted">Sin padre</small>'
                        }
                    </td>
                    <td>
                        ${user.dependientes_count > 0 ? 
                            `<span class="badge bg-success">${user.dependientes_count}</span>` : 
                            '<small class="text-muted">0</small>'
                        }
                    </td>
                    <td>
                        <button onclick="editUserHierarchy(${user.id})" class="btn btn-sm btn-outline-primary" title="Editar jerarquía">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }
        
        function renderHierarchyView() {
            const container = document.getElementById('hierarchyView');
            
            if (hierarchy.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted">
                        <i class="fas fa-sitemap fa-2x mb-2"></i>
                        <p>No hay jerarquías establecidas</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = hierarchy.map(root => renderHierarchyNode(root)).join('');
        }
        
        function renderHierarchyNode(user, level = 0) {
            const indent = '&nbsp;'.repeat(level * 4);
            const levelClass = user.nivel === 'root' ? 'text-danger' : 
                              user.nivel === 'admin' ? 'text-warning' : 'text-info';
            
            let html = `
                <div class="mb-2">
                    ${indent}
                    <i class="fas fa-user ${levelClass}"></i>
                    <strong class="${levelClass}">${user.nombre} ${user.apellido}</strong>
                    <span class="badge bg-${user.nivel === 'root' ? 'danger' : user.nivel === 'admin' ? 'warning' : 'info'} ms-2">
                        ${user.nivel.toUpperCase()}
                    </span>
                    ${user.dependientes_count > 0 ? 
                        `<span class="badge bg-success ms-1">${user.dependientes_count} dependientes</span>` : 
                        ''
                    }
                </div>
            `;
            
            if (user.children && user.children.length > 0) {
                html += user.children.map(child => renderHierarchyNode(child, level + 1)).join('');
            }
            
            return html;
        }
        
        function loadPossibleParents() {
            const select = document.getElementById('assignParentId');
            const currentUserId = document.getElementById('assignUserId').value;
            
            // Todos los usuarios pueden ser padres, excluyendo al usuario actual si está editando
            const parents = allUsers.filter(user => user.id != currentUserId);
            
            select.innerHTML = '<option value="">Sin cuenta principal</option>' +
                parents.map(parent => 
                    `<option value="${parent.id}">${parent.nombre} ${parent.apellido} (${parent.nivel.toUpperCase()})</option>`
                ).join('');
        }
        
        function showAssignModal() {
            // Limpiar formulario
            document.getElementById('assignForm').reset();
            
            // Cargar usuarios en el dropdown
            const select = document.getElementById('assignUserId');
            select.innerHTML = '<option value="">Seleccionar usuario...</option>' +
                allUsers.map(user => 
                    `<option value="${user.id}">${user.nombre} ${user.apellido} (${user.nivel.toUpperCase()})</option>`
                ).join('');
            
            // Cargar posibles padres
            loadPossibleParents();
            
            const modal = new bootstrap.Modal(document.getElementById('assignModal'));
            modal.show();
        }
        
        function editUserHierarchy(userId) {
            const user = allUsers.find(u => u.id == userId);
            if (!user) return;
            
            // Cargar usuarios en el dropdown primero
            const select = document.getElementById('assignUserId');
            select.innerHTML = '<option value="">Seleccionar usuario...</option>' +
                allUsers.map(u => 
                    `<option value="${u.id}">${u.nombre} ${u.apellido} (${u.nivel.toUpperCase()})</option>`
                ).join('');
            
            // Cargar posibles padres
            loadPossibleParents();
            
            // Establecer valores del usuario seleccionado
            document.getElementById('assignUserId').value = userId;
            document.getElementById('assignLevel').value = user.nivel;
            document.getElementById('assignParentId').value = user.padre_id || '';
            
            const modal = new bootstrap.Modal(document.getElementById('assignModal'));
            modal.show();
        }
        
        async function saveAssignment() {
            const userId = document.getElementById('assignUserId').value;
            const level = document.getElementById('assignLevel').value;
            const parentId = document.getElementById('assignParentId').value || null;
            
            if (!userId || !level) {
                showAlert('Por favor completa todos los campos requeridos', 'error');
                return;
            }
            
            try {
                // Actualizar nivel
                const levelResponse = await fetch('api/users/hierarchy.php', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        level: level
                    })
                });
                
                const levelResult = await levelResponse.json();
                
                if (!levelResult.success) {
                    throw new Error(levelResult.error);
                }
                
                // Actualizar jerarquía
                const hierarchyResponse = await fetch('api/users/hierarchy.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        parent_id: parentId
                    })
                });
                
                const hierarchyResult = await hierarchyResponse.json();
                
                if (!hierarchyResult.success) {
                    throw new Error(hierarchyResult.error);
                }
                
                showAlert('Jerarquía actualizada exitosamente', 'success');
                
                // Cerrar modal y recargar
                const modal = bootstrap.Modal.getInstance(document.getElementById('assignModal'));
                modal.hide();
                
                await loadHierarchy();
                
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error actualizando jerarquía: ' + error.message, 'error');
            }
        }
        
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type === 'error' ? 'danger' : type} alert-dismissible fade show`;
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.body.insertBefore(alertDiv, document.body.firstChild);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }
        
        // Filtros
        document.getElementById('searchInput').addEventListener('input', renderUsersTable);
        document.getElementById('levelFilter').addEventListener('change', renderUsersTable);
    </script>
</body>
</html>
