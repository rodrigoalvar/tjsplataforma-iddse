<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Permisos - Gestión Estudios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">
                            <i class="fas fa-shield-alt me-2"></i>
                            Prueba de Permisos - Gestión Estudios
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle me-2"></i>
                            Esta página prueba la verificación de permisos para acceso a Gestión Estudios.
                        </div>
                        
                        <div id="testResults" class="mt-4">
                            <h5>Resultados de la Prueba:</h5>
                            <div id="resultsContainer">
                                <div class="text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Cargando...</span>
                                    </div>
                                    <p class="mt-2">Verificando permisos...</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4">
                            <h5>Acciones de Prueba:</h5>
                            <div class="d-grid gap-2 d-md-flex">
                                <button class="btn btn-primary" onclick="testEstudiosManagerAccess()">
                                    <i class="fas fa-play me-2"></i>
                                    Probar Acceso a Gestión Estudios
                                </button>
                                <button class="btn btn-outline-secondary" onclick="testPermissionAPI()">
                                    <i class="fas fa-cog me-2"></i>
                                    Probar API de Permisos
                                </button>
                                <button class="btn btn-outline-info" onclick="showUserInfo()">
                                    <i class="fas fa-user me-2"></i>
                                    Mostrar Info del Usuario
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let userPermissions = [];

        // Cargar información del usuario al iniciar
        document.addEventListener('DOMContentLoaded', async function() {
            await loadUserInfo();
            displayResults();
        });

        /**
         * Carga la información del usuario actual
         */
        async function loadUserInfo() {
            try {
                console.log('🔍 Cargando información del usuario...');
                
                const response = await fetch('api/auth/validate-session-simple.php');
                const result = await response.json();
                
                if (result.success && result.user) {
                    currentUser = result.user;
                    userPermissions = result.user.permisos || [];
                    console.log('✅ Usuario cargado:', currentUser);
                    console.log('🔐 Permisos:', userPermissions);
                } else {
                    console.warn('⚠️ No se pudo cargar información del usuario');
                }
                
            } catch (error) {
                console.error('🚨 Error cargando usuario:', error);
            }
        }

        /**
         * Muestra los resultados de la verificación
         */
        function displayResults() {
            const container = document.getElementById('resultsContainer');
            
            if (!currentUser) {
                container.innerHTML = `
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        No se pudo obtener información del usuario.
                    </div>
                `;
                return;
            }

            const hasEstudiosPermission = userPermissions.includes('estudios') || userPermissions.includes('all');
            const hasAllPermission = userPermissions.includes('all');
            
            container.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="mb-0">
                                    <i class="fas fa-user me-2"></i>
                                    Información del Usuario
                                </h6>
                            </div>
                            <div class="card-body">
                                <p><strong>Nombre:</strong> ${currentUser.nombre} ${currentUser.apellido || ''}</p>
                                <p><strong>Nivel:</strong> ${currentUser.nivel || 'user'}</p>
                                <p><strong>ID:</strong> ${currentUser.id}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="mb-0">
                                    <i class="fas fa-shield-alt me-2"></i>
                                    Estado de Permisos
                                </h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-2">
                                    <span class="badge ${hasEstudiosPermission ? 'bg-success' : 'bg-danger'}">
                                        <i class="fas ${hasEstudiosPermission ? 'fa-check' : 'fa-times'} me-1"></i>
                                        Gestión Estudios: ${hasEstudiosPermission ? 'PERMITIDO' : 'DENEGADO'}
                                    </span>
                                </div>
                                <div class="mb-2">
                                    <span class="badge ${hasAllPermission ? 'bg-success' : 'bg-secondary'}">
                                        <i class="fas ${hasAllPermission ? 'fa-check' : 'fa-times'} me-1"></i>
                                        Acceso Completo: ${hasAllPermission ? 'SÍ' : 'NO'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="mt-3">
                    <h6>Permisos del Usuario:</h6>
                    <div class="row">
                        ${userPermissions.map(permission => `
                            <div class="col-md-3 mb-2">
                                <span class="badge bg-info">${permission}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="mt-3">
                    <div class="alert ${hasEstudiosPermission ? 'alert-success' : 'alert-danger'}">
                        <i class="fas ${hasEstudiosPermission ? 'fa-check-circle' : 'fa-times-circle'} me-2"></i>
                        <strong>Resultado:</strong> 
                        ${hasEstudiosPermission 
                            ? 'El usuario PUEDE acceder a Gestión Estudios' 
                            : 'El usuario NO PUEDE acceder a Gestión Estudios'
                        }
                    </div>
                </div>
            `;
        }

        /**
         * Prueba el acceso a Gestión Estudios
         */
        async function testEstudiosManagerAccess() {
            try {
                console.log('🧪 Probando acceso a Gestión Estudios...');
                
                // Simular la verificación que hace estudios-manager.html
                const response = await fetch('api/auth/validate-session-simple.php');
                const result = await response.json();
                
                if (result.success && result.user) {
                    const permissions = result.user.permisos || [];
                    const hasEstudiosPermission = permissions.includes('estudios') || permissions.includes('all');
                    
                    if (hasEstudiosPermission) {
                        alert('✅ ACCESO PERMITIDO\n\nEl usuario puede acceder a Gestión Estudios.\n\nRedirigiendo...');
                        window.location.href = 'estudios-manager.html';
                    } else {
                        alert('❌ ACCESO DENEGADO\n\nEl usuario NO tiene permisos para acceder a Gestión Estudios.\n\nPermiso requerido: "estudios" o "all"');
                    }
                } else {
                    alert('⚠️ ERROR\n\nNo se pudo verificar la sesión del usuario.');
                }
                
            } catch (error) {
                console.error('Error probando acceso:', error);
                alert('🚨 ERROR\n\nError al verificar permisos: ' + error.message);
            }
        }

        /**
         * Prueba la API de permisos directamente
         */
        async function testPermissionAPI() {
            try {
                console.log('🧪 Probando API de permisos...');
                
                const response = await fetch('api/auth/validate-session-simple.php');
                const result = await response.json();
                
                alert(`📡 RESPUESTA DE LA API:\n\n${JSON.stringify(result, null, 2)}`);
                
            } catch (error) {
                console.error('Error probando API:', error);
                alert('🚨 ERROR\n\nError al probar API: ' + error.message);
            }
        }

        /**
         * Muestra información detallada del usuario
         */
        function showUserInfo() {
            if (!currentUser) {
                alert('⚠️ No hay información del usuario disponible');
                return;
            }
            
            const info = `
👤 INFORMACIÓN DEL USUARIO:

Nombre: ${currentUser.nombre} ${currentUser.apellido || ''}
ID: ${currentUser.id}
Nivel: ${currentUser.nivel || 'user'}
Email: ${currentUser.email || 'No disponible'}

🔐 PERMISOS:
${userPermissions.length > 0 ? userPermissions.join(', ') : 'Ninguno'}

📋 VERIFICACIÓN:
Gestión Estudios: ${userPermissions.includes('estudios') || userPermissions.includes('all') ? '✅ PERMITIDO' : '❌ DENEGADO'}
Acceso Completo: ${userPermissions.includes('all') ? '✅ SÍ' : '❌ NO'}
            `;
            
            alert(info);
        }
    </script>
</body>
</html>
