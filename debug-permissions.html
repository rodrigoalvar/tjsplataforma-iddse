<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Diagnóstico de Permisos - Portal Estudios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title text-primary">
                    🔍 Diagnóstico de Permisos
                </h1>
                
                <div class="alert alert-info mt-4">
                    <h4>📋 Prueba Específica de Permisos</h4>
                    <p>Este script simula exactamente cómo se procesan los permisos en el modal de edición.</p>
                </div>
                
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5>✏️ Formulario de Prueba</h5>
                            </div>
                            <div class="card-body">
                                <form id="testForm">
                                    <input type="hidden" id="userId" value="2">
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Nombre:</label>
                                        <input type="text" class="form-control" id="nombre" value="Rodrigo">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Apellido:</label>
                                        <input type="text" class="form-control" id="apellido" value="Alvar">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Email:</label>
                                        <input type="email" class="form-control" id="email" value="rodrigoalvar@gmail.com">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Permisos:</label>
                                        <div id="permissionsContainer">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="dashboard" id="perm_dashboard" checked>
                                                <label class="form-check-label" for="perm_dashboard">Dashboard</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="estudios" id="perm_estudios" checked>
                                                <label class="form-check-label" for="perm_estudios">Estudios</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="informes" id="perm_informes" checked>
                                                <label class="form-check-label" for="perm_informes">Informes</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="gestionInformes" id="perm_gestionInformes">
                                                <label class="form-check-label" for="perm_gestionInformes">Gestión Informes</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="usuarios" id="perm_usuarios">
                                                <label class="form-check-label" for="perm_usuarios">Usuarios</label>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div class="card-footer">
                                <button onclick="testPermissions()" class="btn btn-primary">
                                    🔍 Probar Permisos
                                </button>
                                <button onclick="testSaveWithPermissions()" class="btn btn-success">
                                    💾 Guardar con Permisos
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5>📊 Log de Actividad</h5>
                            </div>
                            <div class="card-body">
                                <div id="logContainer" style="height: 400px; overflow-y: auto; background: #f8f9fa; padding: 10px; border-radius: 5px;">
                                    <small class="text-muted">Log de actividad aparecerá aquí...</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="results" class="mt-4"></div>
            </div>
        </div>
    </div>
    
    <script>
        function log(message) {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            logContainer.innerHTML += `<div><small class="text-muted">[${timestamp}]</small> ${message}</div>`;
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }
        
        function testPermissions() {
            log('🔍 Analizando permisos del formulario...');
            
            const form = document.getElementById('testForm');
            const formData = new FormData(form);
            
            // Procesar permisos exactamente como en el código real
            const permissions = [];
            const permissionInputs = form.querySelectorAll('input[type="checkbox"]:checked');
            
            log(`📋 Checkboxes encontrados: ${permissionInputs.length}`);
            
            permissionInputs.forEach(input => {
                permissions.push(input.value);
                log(`✓ Permiso seleccionado: ${input.value}`);
            });
            
            const userData = {
                nombre: formData.get('nombre'),
                apellido: formData.get('apellido'),
                email: formData.get('email'),
                permisos: JSON.stringify(permissions)
            };
            
            log('📤 Datos del formulario:');
            log(JSON.stringify(userData, null, 2));
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="alert alert-info">
                    <h6>📋 Análisis de Permisos</h6>
                    <p><strong>Permisos seleccionados:</strong> ${permissions.length}</p>
                    <p><strong>Lista:</strong> ${permissions.join(', ')}</p>
                    <p><strong>JSON:</strong> ${JSON.stringify(permissions)}</p>
                    <pre>${JSON.stringify(userData, null, 2)}</pre>
                </div>
            `;
        }
        
        async function testSaveWithPermissions() {
            log('💾 Probando guardado con permisos...');
            
            try {
                const form = document.getElementById('testForm');
                const formData = new FormData(form);
                
                // Procesar permisos exactamente como en el código real
                const permissions = [];
                const permissionInputs = form.querySelectorAll('input[type="checkbox"]:checked');
                
                permissionInputs.forEach(input => {
                    permissions.push(input.value);
                });
                
                const userData = {
                    nombre: formData.get('nombre'),
                    apellido: formData.get('apellido'),
                    email: formData.get('email'),
                    telefono: '1234567890',
                    nivel: 'user',
                    permisos: JSON.stringify(permissions)
                };
                
                log('📤 Enviando datos con permisos:');
                log(JSON.stringify(userData, null, 2));
                
                const userId = formData.get('userId');
                
                const response = await fetch(`api/users/manage-real-complete.php?id=${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(userData)
                });
                
                log(`📥 Respuesta recibida: ${response.status} ${response.statusText}`);
                
                const result = await response.json();
                log(`📊 Datos parseados: ${JSON.stringify(result, null, 2)}`);
                
                if (result.success) {
                    log('✅ Guardado exitoso!');
                    
                    // Verificar que se guardaron los permisos
                    setTimeout(async () => {
                        log('🔍 Verificando permisos guardados...');
                        const checkResponse = await fetch('api/users/manage-real-complete.php');
                        const checkData = await checkResponse.json();
                        
                        if (checkData.success) {
                            const user = checkData.data.users.find(u => u.id == userId);
                            if (user) {
                                log(`📋 Usuario encontrado: ${user.nombre} ${user.apellido}`);
                                log(`🔑 Permisos guardados: ${JSON.stringify(user.permisos)}`);
                                
                                const resultsDiv = document.getElementById('results');
                                resultsDiv.innerHTML = `
                                    <div class="alert alert-success">
                                        <h6>✅ Guardado exitoso con permisos</h6>
                                        <p><strong>Usuario:</strong> ${user.nombre} ${user.apellido}</p>
                                        <p><strong>Permisos enviados:</strong> ${JSON.stringify(permissions)}</p>
                                        <p><strong>Permisos guardados:</strong> ${JSON.stringify(user.permisos)}</p>
                                        <p><strong>Coinciden:</strong> ${JSON.stringify(permissions) === JSON.stringify(user.permisos) ? '✅ SÍ' : '❌ NO'}</p>
                                    </div>
                                `;
                            }
                        }
                    }, 1000);
                    
                } else {
                    log(`❌ Error en guardado: ${result.error}`);
                    const resultsDiv = document.getElementById('results');
                    resultsDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h6>❌ Error en guardado</h6>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        </div>
                    `;
                }
                
            } catch (error) {
                log(`💥 Error de JavaScript: ${error.message}`);
                console.error('Error:', error);
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h6>💥 Error de JavaScript</h6>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }
        }
        
        // Inicializar log
        window.addEventListener('DOMContentLoaded', function() {
            log('🚀 Diagnóstico de permisos iniciado');
            log('📋 Formulario listo para pruebas');
        });
    </script>
</body>
</html>
