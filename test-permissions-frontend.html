<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Permisos PACS Query</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>🔍 Test de Permisos PACS Query</h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>📊 Respuesta de la API</h3>
                <pre id="apiResponse" class="bg-light p-3"></pre>
            </div>
            <div class="col-md-6">
                <h3>🎯 Permisos Procesados</h3>
                <div id="permissionsContainer"></div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <h3>🔍 Debugging</h3>
                <pre id="debugLog" class="bg-dark text-light p-3"></pre>
            </div>
        </div>
        
        <button class="btn btn-primary" onclick="testPermissions()">🧪 Probar Permisos</button>
    </div>

    <script>
        let debugLog = [];
        
        function log(message) {
            debugLog.push(message);
            console.log(message);
            document.getElementById('debugLog').textContent = debugLog.join('\n');
        }
        
        async function testPermissions() {
            debugLog = [];
            log('🔍 Iniciando test de permisos...');
            
            try {
                log('📡 Llamando a la API...');
                const response = await fetch('api/users/permissions-simple.php');
                log(`📡 Respuesta recibida: ${response.status} ${response.statusText}`);
                
                const result = await response.json();
                log('📊 Datos decodificados: ' + JSON.stringify(result, null, 2));
                
                document.getElementById('apiResponse').textContent = JSON.stringify(result, null, 2);
                
                if (result.success) {
                    log('✅ API respondió correctamente');
                    log('📋 Categorías disponibles: ' + Object.keys(result.data).join(', '));
                    
                    if (result.data.estudios) {
                        log('✅ Categoría estudios encontrada');
                        log('📊 Permisos en estudios: ' + result.data.estudios.length);
                        
                        result.data.estudios.forEach(perm => {
                            log(`   • ${perm.permission_name} (${perm.permission_key})`);
                            if (perm.permission_key === 'pacs_query') {
                                log('   ✅ PACS Query encontrado!');
                            }
                        });
                        
                        // Simular loadUserPermissions
                        renderPermissions(result.data);
                        
                    } else {
                        log('❌ No se encontró la categoría estudios');
                    }
                } else {
                    log('❌ API respondió con error: ' + result.error);
                }
                
            } catch (error) {
                log('❌ Error en la llamada: ' + error.message);
            }
        }
        
        function renderPermissions(systemPermissions) {
            log('🎨 Renderizando permisos...');
            
            const container = document.getElementById('permissionsContainer');
            container.innerHTML = '';
            
            Object.keys(systemPermissions).forEach(category => {
                log(`🔹 Procesando categoría: ${category}`);
                
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'mb-3';
                
                const categoryTitle = document.createElement('h6');
                categoryTitle.textContent = getCategoryName(category);
                categoryTitle.className = 'text-capitalize';
                categoryDiv.appendChild(categoryTitle);
                
                const permissionsDiv = document.createElement('div');
                permissionsDiv.className = 'd-flex flex-wrap gap-2';
                
                systemPermissions[category].forEach(permission => {
                    log(`   • Procesando permiso: ${permission.permission_name} (${permission.permission_key})`);
                    
                    const checkbox = document.createElement('div');
                    checkbox.className = 'form-check form-check-inline';
                    
                    const input = document.createElement('input');
                    input.type = 'checkbox';
                    input.className = 'form-check-input';
                    input.id = `perm_${permission.permission_key}`;
                    input.value = permission.permission_key;
                    
                    const label = document.createElement('label');
                    label.className = 'form-check-label';
                    label.htmlFor = `perm_${permission.permission_key}`;
                    label.textContent = permission.permission_name;
                    
                    checkbox.appendChild(input);
                    checkbox.appendChild(label);
                    permissionsDiv.appendChild(checkbox);
                });
                
                categoryDiv.appendChild(permissionsDiv);
                container.appendChild(categoryDiv);
            });
            
            log('✅ Renderizado completado');
        }
        
        function getCategoryName(category) {
            const names = {
                'general': 'Generales',
                'estudios': 'Estudios',
                'informes': 'Informes',
                'audio': 'Audio',
                'plantillas': 'Plantillas',
                'visor': 'Visor',
                'admin': 'Administración'
            };
            return names[category] || category;
        }
        
        // Ejecutar test automáticamente
        window.onload = function() {
            log('🚀 Página cargada, iniciando test...');
            testPermissions();
        };
    </script>
</body>
</html>
