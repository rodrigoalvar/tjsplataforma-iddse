<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Diagnóstico de Guardado - Portal Estudios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title text-primary">
                    🔍 Diagnóstico de Guardado
                </h1>
                
                <div class="alert alert-info mt-4">
                    <h4>📋 Simulando Edición de Usuario</h4>
                    <p>Este script simula exactamente lo que hace el modal de edición para identificar el problema.</p>
                </div>
                
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5>📝 Datos de Prueba</h5>
                            </div>
                            <div class="card-body">
                                <form id="testForm">
                                    <div class="mb-3">
                                        <label class="form-label">ID Usuario:</label>
                                        <input type="text" class="form-control" id="userId" value="2" readonly>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Nombre:</label>
                                        <input type="text" class="form-control" id="nombre" value="Admin Modificado">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Apellido:</label>
                                        <input type="text" class="form-control" id="apellido" value="Principal Editado">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email:</label>
                                        <input type="email" class="form-control" id="email" value="admin.editado@portal.com">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Teléfono:</label>
                                        <input type="text" class="form-control" id="telefono" value="9999999999">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Matrícula:</label>
                                        <input type="text" class="form-control" id="matricula" value="ADMIN002">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Especialidad:</label>
                                        <input type="text" class="form-control" id="especialidad" value="Radiología Avanzada">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Nivel:</label>
                                        <select class="form-control" id="nivel">
                                            <option value="user">USER</option>
                                            <option value="admin" selected>ADMIN</option>
                                            <option value="root">ROOT</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Padre ID:</label>
                                        <input type="text" class="form-control" id="padre_id" value="1">
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5>🧪 Pruebas</h5>
                            </div>
                            <div class="card-body">
                                <button onclick="testSave()" class="btn btn-primary btn-lg w-100 mb-3">
                                    💾 Probar Guardado
                                </button>
                                
                                <button onclick="testLoadUsers()" class="btn btn-info btn-lg w-100 mb-3">
                                    📋 Cargar Usuarios
                                </button>
                                
                                <button onclick="testDirectAPI()" class="btn btn-warning btn-lg w-100 mb-3">
                                    🔗 Probar API Directa
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="results" class="mt-4"></div>
            </div>
        </div>
    </div>
    
    <script>
        async function testSave() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="spinner-border" role="status"><span class="visually-hidden">Probando...</span></div>';
            
            try {
                // Simular exactamente lo que hace el modal
                const formData = {
                    id: document.getElementById('userId').value,
                    nombre: document.getElementById('nombre').value,
                    apellido: document.getElementById('apellido').value,
                    email: document.getElementById('email').value,
                    telefono: document.getElementById('telefono').value,
                    matricula_profesional: document.getElementById('matricula').value,
                    especialidad: document.getElementById('especialidad').value,
                    nivel: document.getElementById('nivel').value,
                    padre_id: document.getElementById('padre_id').value || null,
                    permisos: '["dashboard", "estudios", "informes", "gestionInformes", "usuarios", "plantillas", "visor"]'
                };
                
                console.log('📤 Datos enviados:', formData);
                
                const response = await fetch(`api/users/test-ultra-simple.php?id=${formData.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                console.log('📥 Respuesta recibida:', response);
                
                const data = await response.json();
                console.log('📊 Datos parseados:', data);
                
                if (data.success) {
                    resultsDiv.innerHTML = `
                        <div class="alert alert-success">
                            <h6>✅ Guardado exitoso</h6>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h6>❌ Error en guardado</h6>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('💥 Error:', error);
                resultsDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h6>💥 Error de JavaScript</h6>
                        <pre>${error.message}</pre>
                        <p><strong>Stack trace:</strong></p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }
        
        async function testLoadUsers() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="spinner-border" role="status"><span class="visually-hidden">Cargando...</span></div>';
            
            try {
                const response = await fetch('api/users/test-ultra-simple.php');
                const data = await response.json();
                
                if (data.success) {
                    resultsDiv.innerHTML = `
                        <div class="alert alert-info">
                            <h6>📋 Usuarios cargados</h6>
                            <p><strong>Total:</strong> ${data.data.users.length}</p>
                            <div class="table-responsive">
                                <table class="table table-sm">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Nombre</th>
                                            <th>Email</th>
                                            <th>Nivel</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${data.data.users.map(user => `
                                            <tr>
                                                <td>${user.id}</td>
                                                <td>${user.nombre} ${user.apellido}</td>
                                                <td>${user.email}</td>
                                                <td><span class="badge bg-${user.nivel === 'root' ? 'danger' : user.nivel === 'admin' ? 'warning' : 'info'}">${user.nivel.toUpperCase()}</span></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h6>❌ Error cargando usuarios</h6>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h6>💥 Error de JavaScript</h6>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }
        }
        
        async function testDirectAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="spinner-border" role="status"><span class="visually-hidden">Probando...</span></div>';
            
            try {
                // Probar API PUT directamente
                const testData = {
                    nombre: 'Test Directo',
                    apellido: 'API',
                    email: 'test.directo@portal.com'
                };
                
                const response = await fetch('api/users/test-ultra-simple.php?id=1', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });
                
                const data = await response.json();
                
                resultsDiv.innerHTML = `
                    <div class="alert alert-info">
                        <h6>🔗 Prueba API Directa</h6>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Response:</strong></p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h6>💥 Error en API directa</h6>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }
        }
        
        // Cargar usuarios automáticamente
        window.addEventListener('DOMContentLoaded', function() {
            testLoadUsers();
        });
    </script>
</body>
</html>
