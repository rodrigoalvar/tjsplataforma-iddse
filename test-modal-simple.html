<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Modal de Edición Simplificado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title text-primary">
                    🔧 Modal de Edición Simplificado
                </h1>
                
                <div class="alert alert-info mt-4">
                    <h4>📋 Prueba Directa del Modal</h4>
                    <p>Este modal simula exactamente el comportamiento del sistema real.</p>
                </div>
                
                <div class="row mt-4">
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header">
                                <h5>✏️ Editar Usuario</h5>
                            </div>
                            <div class="card-body">
                                <form id="userForm">
                                    <input type="hidden" id="userId" value="2">
                                    
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Nombre:</label>
                                                <input type="text" class="form-control" id="nombre" value="Admin" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Apellido:</label>
                                                <input type="text" class="form-control" id="apellido" value="Principal" required>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Email:</label>
                                                <input type="email" class="form-control" id="email" value="admin@portal.com" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Teléfono:</label>
                                                <input type="text" class="form-control" id="telefono" value="0987654321">
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Matrícula:</label>
                                                <input type="text" class="form-control" id="matricula_profesional" value="ADMIN001">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Especialidad:</label>
                                                <input type="text" class="form-control" id="especialidad" value="Radiología">
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Nivel:</label>
                                                <select class="form-control" id="nivel">
                                                    <option value="user">USER</option>
                                                    <option value="admin" selected>ADMIN</option>
                                                    <option value="root">ROOT</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Padre:</label>
                                                <select class="form-control" id="padre_id">
                                                    <option value="">Sin jerarquía</option>
                                                    <option value="1" selected>Root Administrator (ROOT)</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Permisos:</label>
                                        <div id="permissionsContainer">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="dashboard" id="perm_dashboard" checked>
                                                <label class="form-check-label" for="perm_dashboard">Dashboard</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="estudios" id="perm_estudios" checked>
                                                <label class="form-check-label" for="perm_estudios">Estudios</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="informes" id="perm_informes" checked>
                                                <label class="form-check-label" for="perm_informes">Informes</label>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div class="card-footer">
                                <button onclick="saveUser()" class="btn btn-primary">
                                    💾 Guardar Cambios
                                </button>
                                <button onclick="testFormData()" class="btn btn-info">
                                    🔍 Ver Datos del Formulario
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header">
                                <h5>📊 Log de Actividad</h5>
                            </div>
                            <div class="card-body">
                                <div id="logContainer" style="height: 400px; overflow-y: auto; background: #f8f9fa; padding: 10px; border-radius: 5px;">
                                    <small class="text-muted">Log de actividad aparecerá aquí...</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="results" class="mt-4"></div>
            </div>
        </div>
    </div>
    
    <script>
        function log(message) {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            logContainer.innerHTML += `<div><small class="text-muted">[${timestamp}]</small> ${message}</div>`;
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }
        
        function testFormData() {
            log('🔍 Analizando datos del formulario...');
            
            const form = document.getElementById('userForm');
            const formData = new FormData(form);
            
            const userData = {};
            for (let [key, value] of formData.entries()) {
                userData[key] = value;
            }
            
            // Agregar permisos
            const permissions = [];
            document.querySelectorAll('#permissionsContainer input[type="checkbox"]:checked').forEach(checkbox => {
                permissions.push(checkbox.value);
            });
            userData.permisos = JSON.stringify(permissions);
            
            log('📋 Datos del formulario:');
            log(JSON.stringify(userData, null, 2));
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="alert alert-info">
                    <h6>📋 Datos del Formulario</h6>
                    <pre>${JSON.stringify(userData, null, 2)}</pre>
                </div>
            `;
        }
        
        async function saveUser() {
            log('💾 Iniciando guardado de usuario...');
            
            try {
                const form = document.getElementById('userForm');
                const formData = new FormData(form);
                
                // Construir objeto de datos
                const userData = {};
                for (let [key, value] of formData.entries()) {
                    userData[key] = value;
                }
                
                // Agregar permisos
                const permissions = [];
                document.querySelectorAll('#permissionsContainer input[type="checkbox"]:checked').forEach(checkbox => {
                    permissions.push(checkbox.value);
                });
                userData.permisos = JSON.stringify(permissions);
                
                const userId = userData.id;
                const isEdit = !!userId;
                
                log(`📤 Enviando datos (${isEdit ? 'EDITAR' : 'CREAR'}):`);
                log(`URL: api/users/test-ultra-simple.php${isEdit ? `?id=${userId}` : ''}`);
                log(`Método: ${isEdit ? 'PUT' : 'POST'}`);
                log(`Datos: ${JSON.stringify(userData, null, 2)}`);
                
                const url = isEdit ? `api/users/test-ultra-simple.php?id=${userId}` : 'api/users/test-ultra-simple.php';
                const method = isEdit ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(userData)
                });
                
                log(`📥 Respuesta recibida: ${response.status} ${response.statusText}`);
                
                const result = await response.json();
                log(`📊 Datos parseados: ${JSON.stringify(result, null, 2)}`);
                
                if (result.success) {
                    log('✅ Guardado exitoso!');
                    const resultsDiv = document.getElementById('results');
                    resultsDiv.innerHTML = `
                        <div class="alert alert-success">
                            <h6>✅ Guardado exitoso</h6>
                            <p><strong>Mensaje:</strong> ${result.data.message}</p>
                            <p><strong>Usuario ID:</strong> ${result.data.user_id}</p>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    log(`❌ Error en guardado: ${result.error}`);
                    const resultsDiv = document.getElementById('results');
                    resultsDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h6>❌ Error en guardado</h6>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        </div>
                    `;
                }
                
            } catch (error) {
                log(`💥 Error de JavaScript: ${error.message}`);
                console.error('Error:', error);
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h6>💥 Error de JavaScript</h6>
                        <pre>${error.message}</pre>
                        <p><strong>Stack trace:</strong></p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }
        
        // Inicializar log
        window.addEventListener('DOMContentLoaded', function() {
            log('🚀 Modal de edición simplificado cargado');
            log('📋 Formulario listo para usar');
        });
    </script>
</body>
</html>
