<!DOCTYPE html>
<html>
<head>
    <title>Test API Debug</title>
</head>
<body>
    <h1>Test API Debug</h1>
    <button onclick="testDebugAPI()">Test con informe_id=35</button>
    <button onclick="testDebugAPIStudy()">Test con study_instance_uid</button>
    <div id="result"></div>
    
    <script>
        async function testDebugAPI() {
            try {
                const url = 'api/informes/get-debug.php?informe_id=35';
                console.log('Fetching:', url);
                
                const response = await fetch(url);
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);
                
                const text = await response.text();
                console.log('Response text length:', text.length);
                console.log('Response text:', text);
                
                let data;
                try {
                    data = JSON.parse(text);
                    console.log('Parsed data:', data);
                } catch (e) {
                    console.error('JSON parse error:', e);
                    data = { error: 'No es JSON válido', text: text.substring(0, 500) };
                }
                
                document.getElementById('result').innerHTML = 
                    '<h2>Resultado:</h2>' +
                    '<p><strong>Status:</strong> ' + response.status + '</p>' +
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('result').innerHTML = 
                    '<h2>Error:</h2>' +
                    '<pre>' + error.message + '</pre>';
            }
        }
        
        async function testDebugAPIStudy() {
            try {
                const url = 'api/informes/get-debug.php?study_instance_uid=1.2.276.0.7230010.3.1.2.313262592.1.1760010066.406904';
                console.log('Fetching:', url);
                
                const response = await fetch(url);
                console.log('Response status:', response.status);
                
                const text = await response.text();
                console.log('Response text:', text);
                
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    data = { error: 'No es JSON válido', text: text.substring(0, 500) };
                }
                
                document.getElementById('result').innerHTML = 
                    '<h2>Resultado:</h2>' +
                    '<p><strong>Status:</strong> ' + response.status + '</p>' +
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = 
                    '<h2>Error:</h2>' +
                    '<pre>' + error.message + '</pre>';
            }
        }
    </script>
</body>
</html>
